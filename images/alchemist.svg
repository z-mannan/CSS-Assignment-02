    <stop offset="1" stop-color="#f5a34a"/>
  </linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#123b60"/>
    <stop offset="1" stop-color="#06182d"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f7bd62"/>
    <stop offset="1" stop-color="#b64d2c"/>
  </linearGradient>
</defs>
