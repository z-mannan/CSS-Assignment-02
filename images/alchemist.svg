<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
<title id="title">The Alchemist inspired book cover</title>
<desc id="desc">A shepherd silhouette stands before layered desert mountains under a glowing sun and a deep blue sky.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
